name: IndexNow after production deploy

# On every push to the production branch: wait until Vercel serves this commit, then re-send every sitemap URL.
on:
  push:
    branches: [claude/budgeto-kwop-build-rrbe8d]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait for the deploy of this commit
        if: github.event_name == 'push'
        run: |
          for i in $(seq 1 90); do
            live=$(curl -fsS https://budgetoo-nine.vercel.app/api/version | sed -E 's/.*"sha":"?([0-9a-f]*).*/\1/' || true)
            if [ "$live" = "$GITHUB_SHA" ]; then echo "Live: $live"; exit 0; fi
            sleep 10
          done
          echo "Deploy of $GITHUB_SHA not live after 15 min"; exit 1
      - run: node scripts/indexnow.mjs https://budgetoo-nine.vercel.app
