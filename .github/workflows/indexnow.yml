name: IndexNow after production deploy

# Vercel reports each deployment to GitHub; when a Production deploy succeeds, re-send every sitemap URL.
on:
  deployment_status:
  workflow_dispatch:

jobs:
  ping:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/indexnow.mjs https://budgetoo-nine.vercel.app
